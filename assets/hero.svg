<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.t{fill:#1D1B20;font:700 32px Roboto,'Google Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif}.s{fill:#49454F;font:500 14px Roboto,'Google Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif;letter-spacing:.3px}
.a{fill:#6750A4}.b{fill:#2563EB}
@media (prefers-color-scheme:dark){.t{fill:#E6E0E9}.s{fill:#CAC4D0}.a{fill:#D0BCFF}.b{fill:#8AB4F8}}
</style>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#EADDFF" class="g0"/><stop offset="1" stop-color="#D3E3FD" class="g1"/>
</linearGradient>
<linearGradient id="gd" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2B2057"/><stop offset="1" stop-color="#0E2A4D"/>
</linearGradient>
<clipPath id="c"><rect width="800" height="170" rx="28"/></clipPath>
<style>.bgl{display:block}.bgd{display:none}@media (prefers-color-scheme:dark){.bgl{display:none}.bgd{display:block}}</style>
</defs>
<g clip-path="url(#c)">
<rect class="bgl" width="800" height="170" fill="url(#g)"/>
<rect class="bgd" width="800" height="170" fill="url(#gd)"/>
<circle class="a" cx="700" cy="30" r="90" opacity=".18"><animateTransform attributeName="transform" type="translate" values="0 0;-30 18;0 0" dur="9s" repeatCount="indefinite"/></circle>
<circle class="b" cx="560" cy="170" r="70" opacity=".16"><animateTransform attributeName="transform" type="translate" values="0 0;24 -14;0 0" dur="11s" repeatCount="indefinite"/></circle>
<circle class="a" cx="90" cy="190" r="60" opacity=".14"><animateTransform attributeName="transform" type="translate" values="0 0;16 -20;0 0" dur="10s" repeatCount="indefinite"/></circle>
